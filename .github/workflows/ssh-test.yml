name: VPS SSH Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-test:
    name: Verify VPS SSH and Docker access
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure SSH credentials
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY" || { echo "Missing VPS_SSH_KEY secret"; exit 1; }
          test -n "$VPS_KNOWN_HOSTS" || { echo "Missing VPS_KNOWN_HOSTS secret"; exit 1; }
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 700 "$HOME/.ssh"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
      - name: Test SSH login and Docker permissions
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo "Missing VPS_HOST secret"; exit 1; }
          test -n "$VPS_USER" || { echo "Missing VPS_USER secret"; exit 1; }
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$VPS_USER@$VPS_HOST" \
            'set -eu
             echo "SSH_AUTH_OK"
             id
             docker version --format "DOCKER_SERVER={{.Server.Version}}"
             if test -r /opt/myptstudio/docker-compose.yml; then
               echo "PROJECT_CONFIG_READABLE"
             else
               echo "PROJECT_CONFIG_NOT_READABLE"
             fi'
